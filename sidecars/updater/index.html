<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linux Updater</title>
    <script src="/sidecar.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--background, #0f1115);
        --fg: var(--foreground, #e8eaed);
        --muted: color-mix(in srgb, var(--fg) 62%, transparent);
        --card: var(--card, #1a1d24);
        --border: color-mix(in srgb, var(--fg) 14%, transparent);
        --accent: #1a73e8;
        --ok: #34a853;
        --warn: #f9ab00;
        --danger: #ea4335;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --fast: 160ms;
        --med: 280ms;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 16px;
        opacity: 0;
        transform: translateY(6px);
        animation: page-in 420ms var(--ease) forwards;
      }

      @keyframes page-in {
        to { opacity: 1; transform: none; }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.9; }
      }

      @keyframes shimmer {
        0% { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }

      @keyframes badge-pop {
        from { transform: scale(0.92); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }

      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .sub {
        color: var(--muted);
        margin-bottom: 14px;
      }

      .status-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        margin-bottom: 12px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--fg) 4%, transparent);
        color: var(--muted);
        font-size: 13px;
        transition: border-color var(--fast) ease, background var(--fast) ease, color var(--fast) ease;
      }

      .status-bar.active {
        border-color: color-mix(in srgb, var(--accent) 45%, transparent);
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        color: var(--fg);
      }

      .status-bar.ok {
        border-color: color-mix(in srgb, var(--ok) 40%, transparent);
        background: color-mix(in srgb, var(--ok) 10%, transparent);
        color: var(--fg);
      }

      .status-bar.err {
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
        background: color-mix(in srgb, var(--danger) 10%, transparent);
        color: var(--fg);
      }

      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid color-mix(in srgb, var(--fg) 22%, transparent);
        border-top-color: var(--accent);
        flex: 0 0 auto;
        animation: spin 700ms linear infinite;
        opacity: 0;
        transform: scale(0.8);
        transition: opacity var(--fast) ease, transform var(--fast) ease;
      }

      .status-bar.active .spinner {
        opacity: 1;
        transform: scale(1);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex: 0 0 auto;
        transition: background var(--fast) ease, box-shadow var(--fast) ease;
      }

      .status-bar.ok .status-dot {
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
      }

      .status-bar.err .status-dot {
        background: var(--danger);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent);
      }

      .status-bar.active .status-dot { display: none; }
      .status-bar:not(.active) .spinner { display: none; }

      .grid {
        display: grid;
        gap: 12px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        position: relative;
        overflow: hidden;
        opacity: 0;
        animation: fade-up 420ms var(--ease) forwards;
        transition: border-color var(--med) var(--ease), transform var(--med) var(--ease), box-shadow var(--med) var(--ease);
      }

      #app-card { animation-delay: 40ms; }
      #cli-card { animation-delay: 100ms; }
      #log-card { animation-delay: 160ms; }

      .card.loading {
        border-color: color-mix(in srgb, var(--accent) 35%, transparent);
      }

      .card.loading::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          110deg,
          transparent 20%,
          color-mix(in srgb, var(--fg) 8%, transparent) 45%,
          transparent 70%
        );
        background-size: 200% 100%;
        animation: shimmer 1.2s linear infinite;
        pointer-events: none;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-top: 4px;
      }

      .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      .value {
        font-variant-numeric: tabular-nums;
        word-break: break-all;
        text-align: right;
        transition: opacity var(--fast) ease, filter var(--fast) ease;
      }

      .card.loading .value {
        opacity: 0.45;
        filter: blur(0.4px);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--fg) 4%, transparent);
        animation: badge-pop 280ms var(--ease);
      }

      .badge.ok {
        color: var(--ok);
        border-color: color-mix(in srgb, var(--ok) 40%, transparent);
        background: color-mix(in srgb, var(--ok) 10%, transparent);
      }

      .badge.warn {
        color: var(--warn);
        border-color: color-mix(in srgb, var(--warn) 40%, transparent);
        background: color-mix(in srgb, var(--warn) 10%, transparent);
      }

      .badge.checking {
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 40%, transparent);
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }

      .badge .mini-spin {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1.5px solid color-mix(in srgb, var(--accent) 35%, transparent);
        border-top-color: var(--accent);
        animation: spin 650ms linear infinite;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--fg) 6%, transparent);
        color: var(--fg);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 36px;
        transition:
          transform var(--fast) var(--ease),
          background var(--fast) ease,
          border-color var(--fast) ease,
          box-shadow var(--fast) ease,
          opacity var(--fast) ease;
      }

      button:hover:not(:disabled) {
        background: color-mix(in srgb, var(--fg) 11%, transparent);
        transform: translateY(-1px);
      }

      button:active:not(:disabled) {
        transform: translateY(0) scale(0.98);
      }

      button.primary {
        background: var(--accent);
        border-color: transparent;
        color: #fff;
        box-shadow: 0 1px 0 color-mix(in srgb, #000 18%, transparent);
      }

      button.primary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 88%, #fff);
        box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 28%, transparent);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      button .btn-spin {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent);
        border-top-color: currentColor;
        animation: spin 650ms linear infinite;
        display: none;
      }

      button.busy .btn-spin { display: inline-block; }
      button.busy .btn-label { opacity: 0.92; }

      .warn-box {
        border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
        background: color-mix(in srgb, var(--warn) 12%, transparent);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--fg);
        margin-bottom: 12px;
        font-size: 13px;
        animation: fade-up 420ms var(--ease) both;
      }

      pre {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--muted);
        transition: color var(--fast) ease;
      }

      #log-card.busy pre {
        color: var(--fg);
      }

      .error {
        color: var(--danger);
        margin-top: 8px;
        font-size: 13px;
        animation: fade-up 240ms var(--ease);
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        body { opacity: 1; transform: none; }
        .card { opacity: 1; }
        .card.loading::after { display: none; }
      }
    </style>
  </head>
  <body>
    <h1>Linux Updater</h1>
    <div class="sub">Desktop App (/opt) and agy CLI</div>

    <div class="warn-box">
      Updating the App quits Antigravity and prompts for pkexec. Relaunch the app afterward.
    </div>

    <div class="status-bar" id="status-bar" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-text">Ready</span>
    </div>

    <div class="grid">
      <section class="card" id="app-card">
        <div class="label">Desktop App</div>
        <div class="row"><span>Local</span><span class="value" id="app-local">…</span></div>
        <div class="row"><span>Remote</span><span class="value" id="app-remote">…</span></div>
        <span class="badge checking" id="app-badge"><span class="mini-spin" aria-hidden="true"></span>checking</span>
      </section>
      <section class="card" id="cli-card">
        <div class="label">CLI (agy)</div>
        <div class="row"><span>Local</span><span class="value" id="cli-local">…</span></div>
        <div class="row"><span>Remote</span><span class="value" id="cli-remote">…</span></div>
        <span class="badge checking" id="cli-badge"><span class="mini-spin" aria-hidden="true"></span>checking</span>
      </section>
    </div>

    <div class="actions">
      <button type="button" id="btn-check">
        <span class="btn-spin" aria-hidden="true"></span>
        <span class="btn-label">Check updates</span>
      </button>
      <button type="button" class="primary" id="btn-app">
        <span class="btn-spin" aria-hidden="true"></span>
        <span class="btn-label">Update App</span>
      </button>
      <button type="button" class="primary" id="btn-cli">
        <span class="btn-spin" aria-hidden="true"></span>
        <span class="btn-label">Update CLI</span>
      </button>
    </div>

    <section class="card" id="log-card">
      <div class="label">Log</div>
      <pre id="log">Ready.</pre>
      <div class="error" id="error" hidden></div>
    </section>

    <script>
      const $ = (id) => document.getElementById(id);
      const ACTION_LABELS = {
        '/api/status': 'Checking for updates…',
        '/api/update-app': 'Updating desktop App…',
        '/api/update-cli': 'Updating CLI…',
      };
      const BUTTON_IDLE = {
        'btn-check': 'Check updates',
        'btn-app': 'Update App',
        'btn-cli': 'Update CLI',
      };
      const BUTTON_BUSY = {
        'btn-check': 'Checking…',
        'btn-app': 'Updating…',
        'btn-cli': 'Updating…',
      };

      let activePath = null;

      function setStatus(mode, text) {
        const bar = $('status-bar');
        bar.classList.remove('active', 'ok', 'err');
        if (mode) bar.classList.add(mode);
        $('status-text').textContent = text;
      }

      function setBusy(path, busy) {
        activePath = busy ? path : null;
        const activeBtn =
          path === '/api/status' ? 'btn-check' :
          path === '/api/update-app' ? 'btn-app' :
          path === '/api/update-cli' ? 'btn-cli' : null;

        ['btn-check', 'btn-app', 'btn-cli'].forEach((id) => {
          const btn = $(id);
          btn.disabled = busy;
          const isActive = busy && id === activeBtn;
          btn.classList.toggle('busy', isActive);
          btn.querySelector('.btn-label').textContent =
            isActive ? BUTTON_BUSY[id] : BUTTON_IDLE[id];
        });

        const checking = busy && path === '/api/status';
        ['app-card', 'cli-card'].forEach((id) => {
          $(id).classList.toggle('loading', checking);
        });
        $('log-card').classList.toggle('busy', busy);

        if (checking) {
          setBadgeChecking($('app-badge'));
          setBadgeChecking($('cli-badge'));
        }
      }

      function setBadgeChecking(el) {
        el.className = 'badge checking';
        el.innerHTML = '<span class="mini-spin" aria-hidden="true"></span>checking';
      }

      function setBadge(el, available) {
        el.className = 'badge ' + (available ? 'warn' : 'ok');
        el.textContent = available ? 'update available' : 'up to date';
      }

      function renderStatus(status) {
        const app = status.app || {};
        const cli = status.cli || {};
        $('app-local').textContent = app.localBuildId
          ? `${app.localVersion || '?'} (${app.localBuildId})`
          : app.localVersion || 'not installed';
        $('app-remote').textContent = app.remoteBuildId
          ? `${app.remoteVersion || '?'} (${app.remoteBuildId})`
          : 'unknown';
        $('cli-local').textContent = cli.localVersion || 'not installed';
        $('cli-remote').textContent = cli.remoteVersion || 'unknown';
        setBadge($('app-badge'), !!app.updateAvailable);
        setBadge($('cli-badge'), !!cli.updateAvailable);
      }

      async function callApi(path) {
        $('error').hidden = true;
        setBusy(path, true);
        setStatus('active', ACTION_LABELS[path] || 'Working…');
        $('log').textContent = ACTION_LABELS[path] || `Running ${path}…`;

        try {
          let data;
          if (window.sidecar && typeof window.sidecar.api === 'function') {
            data = await window.sidecar.api(path, {});
          } else {
            const res = await fetch(path, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: '{}',
            });
            data = await res.json();
          }

          if (data.log) {
            $('log').textContent = data.log;
          } else if (data.status) {
            $('log').textContent = JSON.stringify(data.status, null, 2);
          } else {
            $('log').textContent = JSON.stringify(data, null, 2);
          }

          if (!data.ok) {
            $('error').hidden = false;
            $('error').textContent = data.error || `Command failed (code ${data.code ?? '?'})`;
            setStatus('err', data.error || 'Something went wrong');
          } else if (path === '/api/status') {
            const appUp = data.status?.app?.updateAvailable;
            const cliUp = data.status?.cli?.updateAvailable;
            if (appUp || cliUp) {
              setStatus('ok', 'Updates available');
            } else {
              setStatus('ok', 'Everything is up to date');
            }
          } else if (path === '/api/update-app') {
            setStatus('ok', 'App update finished — relaunch Antigravity');
          } else if (path === '/api/update-cli') {
            setStatus('ok', 'CLI update finished');
          }

          if (data.status) {
            renderStatus(data.status);
          } else if (path !== '/api/status') {
            await refresh();
            return;
          }
          return data;
        } catch (err) {
          $('error').hidden = false;
          $('error').textContent = String(err);
          $('log').textContent = String(err);
          setStatus('err', String(err));
        } finally {
          setBusy(path, false);
        }
      }

      async function refresh() {
        await callApi('/api/status');
      }

      $('btn-check').addEventListener('click', () => refresh());
      $('btn-app').addEventListener('click', async () => {
        if (!confirm('Update the desktop App? Antigravity will quit and pkexec will prompt for authorization.')) {
          return;
        }
        await callApi('/api/update-app');
      });
      $('btn-cli').addEventListener('click', async () => {
        if (!confirm('Update the agy CLI via the official install script?')) {
          return;
        }
        await callApi('/api/update-cli');
      });

      refresh();
    </script>
  </body>
</html>
